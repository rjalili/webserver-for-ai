# ngx_http_b_module -- http-b for nginx. Include this from the http block,
# after "load_module modules/ngx_http_b_module.so;" at the top of nginx.conf.
# Every directive is the Apache directive AIAgentXyz as http_b_xyz; see README.md.

# Endpoints run in this pool (they may wait for an AI service).
# Put this line in the main context of nginx.conf, outside "http":
#   thread_pool default threads=32;

http_b on;

# Describe the site (shown to agents in /.well-known/ai)
#http_b_site_name         "Bluewhite";
#http_b_site_description  "Whale-themed widgets, shipped worldwide.";
#http_b_contact           hello@example.com;

# Keep agents out of some areas (never listed, never explained)
#http_b_exclude /admin /private;

# Short answers for common questions
#http_b_faq "ship canada" "Yes, we ship to Canada.";

# AI service for open questions (keyword search without one)
#http_b_ai_service  anthropic;
#http_b_ai_key      file:/etc/nginx/http_b.key;    # chmod 600; or env:ANTHROPIC_API_KEY
#http_b_activation  learn;

# Actions (forms, log in, basket, checkout): on by default once learned
#http_b_actions on;

# Where learned pages, conversations and the access map are kept
#http_b_knowledge_dir /var/lib/nginx/http_b/www.example.com;

# Read the application's code to find pages that need a login
#http_b_source_dir /var/www/app /;
