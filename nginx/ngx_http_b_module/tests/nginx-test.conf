worker_processes 2; error_log logs/error.log info; pid logs/nginx.pid;
events {}
http {
  include mime.types; gzip on; gzip_types text/html application/json;
  http_b on; http_b_site_name "Bluewhite"; http_b_knowledge_dir /tmp/http_b-test;
  http_b_ai_service anthropic; http_b_ai_key sk-test-123; http_b_ai_endpoint http://127.0.0.1:9999/v1/messages;
  http_b_activation immediate; http_b_source_dir /path/to/webserver-for-ai/tests/fixtures/express-app /app; http_b_source_dir /path/to/webserver-for-ai/tests/fixtures/spa /spa; http_b_source_dir /path/to/webserver-for-ai/tests/fixtures/laravel /;
  http_b_ad "SeaCo" "Charter a sailing boat in Montpellier, 20% off." "https://seaco.example/charter" "/shop/ sailing boat";
  http_b_ads on;
  http_b_faq "ship canada" "Yes, we ship to Canada.";
  server { listen 18080; server_name localhost; root /path/to/site; index index.html index.php;
    location /lan/ { allow 127.0.0.1; deny all; }
    location ~ \.php$ { fastcgi_pass 127.0.0.1:9000; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; }
  }
}
