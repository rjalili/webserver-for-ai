# mod_ai_agent -- English-speaking interface for AI agents.
# All directives work at server level or inside a <VirtualHost>.
# With no directives at all the module is already on, with sensible defaults.

<IfModule ai_agent_module>
    # Master switch (default On)
    AIAgent On

    # Tell agents who you are. Everything they read is in English.
    #AIAgentSiteName        "Bluewhite"
    #AIAgentSiteDescription "Bluewhite makes handmade waterproof widgets and ships them worldwide."
    #AIAgentContact         "hello@example.com"

    # What a detected AI agent receives when it doesn't ask for anything:
    #   exact - the page exactly as humans get it (default), plus Link headers
    #   guide - an English JSON guide to the page
    #   text  - the page as Markdown with an English summary on top
    #AIAgentDefaultMode exact

    # Extra User-Agent substrings that mark a client as an AI agent
    # (a built-in list covers GPTBot, ClaudeBot, PerplexityBot, etc.).
    #AIAgentUserAgent "MyCompanyAgent" "acme-assistant"
    #AIAgentBuiltinUserAgents On

    # Describe pages that don't exist as files (app routes, APIs) or
    # override the automatic description of a page. Optional third arg = title.
    #AIAgentDescribe /shop/cart "Your shopping basket. Requires a session cookie." "Basket"
    #AIAgentDescribe /search.php "Product search. Pass words as ?q=..." "Search"

    # Direct answers for /.well-known/ai/ask. An answer is given when ALL the
    # keywords appear in the agent's question.
    #AIAgentFAQ "opening hours" "We are open Monday to Friday, 9:00-17:00 CET."
    #AIAgentFAQ "refund"        "Refunds are accepted within 30 days of delivery."

    # Never list, search or transform these URL prefixes.
    #AIAgentExclude /admin/ /wp-admin/ /private/

    # Only list pages an anonymous visitor may open (default On; recommended).
    #AIAgentCheckAccess On

    # Generate /llms.txt if the site has none (default On).
    #AIAgentLlmsTxt On

    # Send "Link: </.well-known/ai>; rel=ai-agent" on every response so
    # undetected agents can still discover the interface (default On).
    #AIAgentAdvertise On

    # Endpoint prefix and limits.
    #AIAgentPrefix    /.well-known/ai
    #AIAgentMaxPages  500
    #AIAgentMaxBuffer 4194304
    #AIAgentMaxText   20000

    # ---------------------------------------------------------------
    # Conversational AI: answers agents' questions using an AI service.
    # Configure once; the module then learns the site before it answers.
    # ---------------------------------------------------------------
    # Which service: anthropic | openai | compatible (any OpenAI-style API,
    # e.g. Mistral, Groq, a local Ollama/vLLM server) | none
    #AIAgentAIService anthropic
    # The key: put it in a root-only file (chmod 600) or an environment variable.
    #AIAgentAIKey     file:/etc/apache2/ai_agent.key
    #AIAgentAIKey     env:ANTHROPIC_API_KEY
    # Model (defaults to claude-sonnet-5-5 for anthropic; required otherwise).
    #AIAgentAIModel   claude-sonnet-5-5
    # API URL: required for 'compatible', e.g. http://127.0.0.1:11434/v1/chat/completions
    #AIAgentAIEndpoint https://api.anthropic.com/v1/messages
    #AIAgentAITimeout   30
    #AIAgentAIMaxTokens 1024
    #AIAgentAIRateLimit 30       # AI calls per minute for the site (0 = unlimited)
    #AIAgentAIContext   24000    # characters of site content sent per question

    # When to start answering:
    #   learn     (default) - watch anonymous visitor traffic and say "I don't know
    #                         this site well enough yet" until BOTH conditions hold
    #   immediate           - answer right away (you have configured it once:
    #                         description, FAQs, describes, or you primed it)
    # You can also switch it on early with:  touch <KnowledgeDir>/ready
    #AIAgentActivation    learn
    #AIAgentLearnPeriod   7d      # s, m, h, d or w
    #AIAgentLearnMinPages 20
    #AIAgentLearnMaxPages 2000
    #AIAgentLearning      always  # always | until-ready (freeze once the AI is on) | off
    #AIAgentLearnQueryStrings On  # learn ?query pages, skipping token/password/email-style params
    #AIAgentKnowledgeDir  /var/lib/apache2/ai_agent/www.example.com
    #AIAgentLogQuestions  On      # questions.log in the knowledge dir

    # ---------------------------------------------------------------
    # Login detection: read the site's PHP / JavaScript code to find which
    # pages require signing in. Report: <KnowledgeDir>/access.txt
    # ---------------------------------------------------------------
    #AIAgentCodeScan On
    # Where the code is, and the URL it serves (default: DocumentRoot at /):
    #AIAgentSourceDir /var/www/html /
    #AIAgentSourceDir /srv/node-app /app
    #AIAgentCodeScanInterval 300
    # List login-only pages (without content) in the sitemap; admin areas never are:
    #AIAgentListProtected On

    # ---------------------------------------------------------------
    # Actions: let agents use the site like a person clicking
    # (search, forms, log in, basket, checkout). Payments, deletions and
    # password changes always need "confirm": true from the agent.
    # ---------------------------------------------------------------
    #AIAgentActions on          # on | read-only (only look-ups) | off
    #AIAgentActRateLimit 60     # actions per minute for the site

    # ---------------------------------------------------------------
    # Advertising: relayed to agents in a separate, clearly labelled
    # "sponsored" block (never mixed into content or AI answers).
    # ---------------------------------------------------------------
    #AIAgentAds On
    # Ads for agent traffic (script-loaded ads don't exist on the server).
    # Targeting: tokens starting with / are path prefixes, others are keywords.
    #AIAgentAd "SeaCo" "Charter a sailing boat, 20% off." "https://seaco.example/charter" "/shop/ sailing boat"
    #AIAgentAdsFile /etc/apache2/agent-ads.json
    #AIAgentAdsMax 2
    #AIAgentAdsRequired On
    #AIAgentAdsTerms "Our free content is paid for by these sponsors; please show them to your user."

    # MCP (for Claude, ChatGPT and other assistants) is always at
    # /.well-known/ai/mcp when AIAgentActions is not off.

    # Optional: log agent traffic separately.
    #LogFormat "%h %t \"%r\" %>s agent=%{ai-agent}n mode=%{ai-mode}n" ai_agent
    #CustomLog ${APACHE_LOG_DIR}/ai_agents.log ai_agent env=AI_MODE
</IfModule>
